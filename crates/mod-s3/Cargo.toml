[package]
name = "mod-s3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FreeSWITCH mod_s3 module in Rust: fswtch glue over s3-core for S3 recording upload"

[lib]
name = "mod_s3"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
s3-core = { path = "../s3-core" }
fswtch = "0.1.8"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

[build-dependencies]
pkg-config = "0.3"

[lints]
workspace = true
